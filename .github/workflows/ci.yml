name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua
        run: brew install lua

      - name: Install luacheck
        run: |
          brew install luacheck || luarocks install luacheck
          brew install shellcheck

      - name: Run luacheck
        run: luacheck trumpify/ prompts/

      - name: Run shellcheck
        run: shellcheck setup.sh test/test_setup.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua
        run: brew install lua

      - name: Install busted
        run: |
          brew install luarocks
          luarocks install busted

      - name: Run tests
        run: |
          busted .
          bash test/test_setup.sh
